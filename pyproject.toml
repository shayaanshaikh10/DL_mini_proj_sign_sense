[project]
name = "dl-mini-proj-sign-sense"
version = "0.1.0"
description = "SignSense: CNN-based traffic sign recognition on GTSRB"
readme = "README.md"
# TensorFlow 2.16 supports Python 3.9-3.12; we use 3.11 everywhere
requires-python = ">=3.11,<3.12"
dependencies = [
    "jupyter>=1.1.1",
    "kaggle>=1.6",
    "matplotlib>=3.7,<4.0",
    "numpy>=1.23,<2.0",
    "opencv-python>=4.8,<5.0",
    "pandas>=2.0,<3.0",
    "pillow>=10.0",
    "scikit-learn>=1.3,<2.0",
    "seaborn>=0.13,<0.14",
    "streamlit>=1.30,<2.0",
    "tensorflow>=2.15,<2.17",
    # On Windows the real TensorFlow code lives in "tensorflow-intel";
    # uv misses this hidden dependency, so we list it explicitly.
    "tensorflow-intel==2.16.2 ; sys_platform == 'win32'",
]

[tool.uv]
# Newer versions of this TensorFlow helper have no Windows wheels.
# 0.31.0 is the last version that installs on Windows (and Linux/Colab).
constraint-dependencies = ["tensorflow-io-gcs-filesystem==0.31.0"]
